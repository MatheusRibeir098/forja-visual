<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forja Visual — demo do composite (dev)</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, 'SFMono-Regular', 'Liberation Mono', monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b0c;
        color: #e8e6e1;
      }

      #gl {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .panel {
        position: fixed;
        left: 1.5rem;
        bottom: 1.5rem;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-width: min(24rem, calc(100vw - 3rem));
        padding: 1rem 1.25rem;
        border: 1px solid #34333044;
        border-radius: 0.75rem;
        background: #0b0b0cd9;
        backdrop-filter: blur(6px);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.8125rem;
      }

      .row input[type='range'] {
        flex: 1;
        accent-color: #e8e6e1;
      }

      .value {
        min-width: 3.5ch;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      pre {
        margin: 0;
        font-size: 0.75rem;
        line-height: 1.5;
        color: #b9b6b0;
        white-space: pre-wrap;
      }

      .hint {
        font-size: 0.6875rem;
        color: #8a8781;
      }

      .hint a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>

    <div class="panel">
      <div class="row">
        <label for="progress">progress</label>
        <input id="progress" type="range" min="0" max="1" step="0.001" value="0.5" />
        <output class="value" id="progress-value">0.500</output>
      </div>
      <pre id="stats">iniciando…</pre>
      <p class="hint">
        Verificação automática do threshold:
        <a href="?check=1">?check=1</a>
      </p>
    </div>

    <script type="module" src="/dev/composite.ts"></script>
  </body>
</html>
