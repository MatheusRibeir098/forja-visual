<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f5f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)" />
    <!--
      Descrição, Open Graph e Twitter Card entram aqui no build e no dev server,
      a partir de `src/content/social.ts` — mesmo mecanismo de F6 (ver
      `forjaSocialMeta` em `vite.config.ts`). O domínio absoluto que `og:url` e
      `og:image` exigem mora numa constante só, `SITE_ORIGIN`, naquele arquivo.
    -->
    <!--forja:social-->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link
      rel="preload"
      href="/fonts/instrument-serif-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-sans-var-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Forja Visual — Protótipo 01</title>
  </head>
  <body>
    <a class="skip-link" href="#hero">Pular para o conteúdo</a>

    <canvas id="gl" aria-hidden="true"></canvas>

    <main>
      <!--
        A ordem das seções é a do argumento, e o `main.ts` monta exatamente nela:
        a média (hero) → por que ela acontece (tese) → um caso que escapou
        (referência) → a técnica-assinatura desse caso funcionando (campo) →
        material (relevo) → o catálogo → os princípios → os números medidos.

        Cada `<section>` traz só o esqueleto: título de rascunho para quem lê sem
        JavaScript e o `aria-labelledby` que a seção mantém válido ao montar.
        Exceção deliberada: F6 (princípios) vem com o markup **inteiro** inlinado
        no build — ver `inlinePrincipios` em `vite.config.ts`.
      -->
      <section id="hero" class="section" aria-labelledby="hero-title">
        <h1 id="hero-title" class="t-display">Forja Visual</h1>
      </section>

      <section id="tese" class="section" aria-labelledby="tese-title">
        <h2 id="tese-title" class="t-title">A tese</h2>
      </section>

      <section id="referencia" class="section" aria-labelledby="referencia-title">
        <h2 id="referencia-title" class="t-title">A referência</h2>
      </section>

      <section id="campo" class="section" aria-labelledby="campo-title">
        <h2 id="campo-title" class="t-title">O campo</h2>
      </section>

      <!--
        Sem título de rascunho aqui: `sections/relevo/markup.ts` **acrescenta** o
        seu conteúdo (não substitui o da seção) e cria o próprio
        `<h2 id="relevo-title">`. Um título aqui viraria id duplicado.
      -->
      <section id="relevo" class="section" aria-labelledby="relevo-title"></section>

      <section id="catalogo" class="section" aria-labelledby="catalogo-title">
        <h2 id="catalogo-title" class="t-title">O catálogo</h2>
      </section>

      <section id="principios" class="section" aria-labelledby="principios-title">
        <!--forja:principios-->
      </section>

      <section id="medicao" class="section" aria-labelledby="medicao-title">
        <h2 id="medicao-title" class="t-title">Medição</h2>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
